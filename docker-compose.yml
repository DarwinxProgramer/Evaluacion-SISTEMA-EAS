version: '3.8'

services:
  eas_broker:
    image: eclipse-mosquitto:latest
    container_name: eas_broker
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/certs:/mosquitto/certs
    networks:
      - eas_network

  eas_edge_node:
    image: homeassistant/home-assistant:stable
    container_name: eas_edge_node
    environment:
      - TZ=America/Bogota
    volumes:
      - ./homeassistant:/config
    ports:
      - "8123:8123"
    networks:
      - eas_network
    depends_on:
      - eas_broker

  eas_monitor:
    image: prom/prometheus:latest
    container_name: eas_monitor
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - eas_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - eas_network

  backend:
    build: ./backend
    container_name: eas_backend
    ports:
      - "3001:3001"
    volumes:
      - ./:/app_root
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PROMETHEUS_URL=http://eas_monitor:9090
    networks:
      - eas_network

  frontend:
    build: ./Frontend
    container_name: eas_frontend
    ports:
      - "80:80"
    networks:
      - eas_network
    depends_on:
      - backend

networks:
  eas_network:
    driver: bridge
